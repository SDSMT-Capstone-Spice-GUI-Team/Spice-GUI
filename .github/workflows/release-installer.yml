name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag (e.g. v1.0.0) — only used for artifact naming"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  build-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"
          python-version: "3.12"
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ runner.os }}

      - name: Install dependencies (runtime only, no dev tooling)
        run: uv sync --no-dev

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          elif [[ "${{ github.event.inputs.version_tag }}" != "" && "${{ github.event.inputs.version_tag }}" != "dev" ]]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          else
            VERSION="dev-$(echo ${{ github.sha }} | cut -c1-8)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Install PyInstaller into the synchronized runtime env
        run: uv pip install pyinstaller
        # NOTE: `uvx pyinstaller` must NOT be used here — it runs in a throwaway
        # isolated env without the project deps, so PyQt6, the Qt DLLs, and the
        # qwindows platform plugin are silently dropped from the bundle.
      - name: Build PyInstaller bundle
        run: uv run pyinstaller SpiceGUI.spec

      - name: Verify bundle
        shell: bash
        run: |
          test -f dist/SpiceGUI/SpiceGUI.exe || { echo "ERROR: SpiceGUI.exe not found in dist/SpiceGUI/"; exit 1; }
          echo "Bundle contents:"
          ls -la dist/SpiceGUI/

      - name: Update version in Inno Setup script
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}" -replace '^v', ''
          # VersionInfoVersion requires strict numeric X.Y.Z — derive a valid one
          if ($version -match '^(\d+)\.(\d+)\.(\d+)') {
            $numericVersion = "$($matches[1]).$($matches[2]).$($matches[3])"
          } else {
            # dev build — fall back to 0.0.0
            $numericVersion = "0.0.0"
          }
          $content = Get-Content installer/spicegui.iss -Raw
          $content = $content -replace '#define MyAppVersion\s+"[^"]+"', "#define MyAppVersion        `"$version`""
          $content = $content -replace '#define MyAppNumericVersion\s+"[^"]+"', "#define MyAppNumericVersion `"$numericVersion`""
          Set-Content installer/spicegui.iss -Value $content
          Write-Host "Display version: $version, numeric: $numericVersion"

      - name: Compile installer with Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\spicegui.iss

      - name: List output
        shell: bash
        run: ls -la installer/Output/

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ steps.version.outputs.version }}
          path: installer/Output/*.exe
          retention-days: 30

      - name: Attach installer to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
          fail_on_unmatched_files: true
