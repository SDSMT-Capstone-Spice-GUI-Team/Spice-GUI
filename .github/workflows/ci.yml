name: CI

on:
  push:
    branches: [main, develop, 'epic/**']
  pull_request:
    branches: [main, develop, 'epic/**']
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ runner.os }}

      - name: Install dev deps
        run: uv sync --dev

      # Check order: ruff lint → isort → black (ruff-format removed — it
      # and black disagree on some formatting, causing infinite reformat loops)
      - name: Run ruff check
        run: uv run ruff check app/ --output-format=github

      - name: Run isort check
        run: uv run isort --check-only --profile=black --line-length=120 app/

      - name: Run black check
        run: uv run black --check --line-length=120 app/

  security:
    name: Security Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ runner.os }}

      - name: Run bandit (via uvx)
        run: uvx bandit -r app/ -x app/tests --severity-level medium

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ runner.os }}

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 xvfb

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests with coverage (Linux)
        if: runner.os == 'Linux'
        working-directory: app
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run uv run python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing

      - name: Run tests with coverage (Windows)
        if: runner.os == 'Windows'
        working-directory: app
        run: uv run python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing

  integration:
    name: Integration (ngspice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ runner.os }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ngspice libegl1 xvfb

      - name: Install dependencies
        run: uv sync --dev

      - name: Run integration tests
        working-directory: app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          rc=0
          xvfb-run uv run python -m pytest tests/integration/ -v --tb=short -m ngspice || rc=$?
          # exit code 5 = no tests collected (suite may be empty initially)
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then exit "$rc"; fi

  import-check:
    name: Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ runner.os }}

      - name: Install dependencies
        run: uv sync

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 xvfb

      - name: Verify application imports
        working-directory: app
        run: xvfb-run uv run python -c "from GUI.main_window import MainWindow; print('Import OK')"
